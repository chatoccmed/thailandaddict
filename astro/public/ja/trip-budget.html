<header class="head">

<div class="wrap">
  <div class="hero">
    <h1>タイ旅行 <span class="g">予算計算ツール</span></h1>
    <p>日数・人数・旅のスタイルを選ぶと、宿泊・食事・移動・アクティビティの実際の日々の費用をもとに、すぐに旅行費用の目安がわかります。</p>
  </div>

  <div class="sec">
    <div class="sec-h">✏️ あなたの旅</div>
    <div class="sec-sub">数字を調整すると予算がすぐに更新されます</div>
    <div class="row2">
      <div class="field">
        <label>📅 何泊しますか</label>
        <div class="step"><button id="dminus" aria-label="日数を少なく">–</button><span class="v" id="days">7日間</span><button id="dplus" aria-label="追加の日数">+</button></div>
      </div>
      <div class="field">
        <label>👥 何名様ですか</label>
        <div class="step"><button id="pminus" aria-label="旅行者が少ない">–</button><span class="v" id="ppl">2名</span><button id="pplus" aria-label="他の旅行者">+</button></div>
      </div>
    </div>
    <div class="field" style="margin-top:16px">
      <label>🎒 旅のスタイル</label>
      <div class="opts" id="styles">
        <button class="opt pace" data-k="backpacker"><span class="ic">🎒</span>バックパッカー向け<small>ドミトリー ・ 屋台グルメ</small></button>
        <button class="opt pace" data-k="midrange"><span class="ic">🏨</span>ミドルレンジ<small>3〜4つ星 · 着席スタイル</small></button>
        <button class="opt pace" data-k="luxury"><span class="ic">✨</span>ラグジュアリー<small>リゾート · ファインダイニング</small></button>
      </div>
    </div>
  </div>

  <div class="sec res">
    <div class="cap">旅行全体のおおまかな予算</div>
    <div class="bigamt"><span class="g" id="amt">฿0</span></div>
    <div class="perday" id="perday">1日あたり · 1人あたり</div>
    <div class="bd" id="bd"></div>
    <p class="note" id="note"></p>
  </div>

  <button class="go" id="toPlanner">🧭 日程別の旅行プランを作る →</button>
  <a class="link2" href="/ja/thailand-travel-budget">タイ旅行の予算ガイド全文を読む — 節約術+実際の費用 →</a>

</div>

<script>
function track(ev,p){try{window.dataLayer=window.dataLayer||[];window.dataLayer.push(Object.assign({event:ev},p||{}));if(window.gtag)window.gtag('event',ev,p||{})}catch(e){}}
(function(){
  var TIERS={
    backpacker:{label:'Backpacker',low:800,high:1500,plus:false,note:'Dorm bed, street food and public transport. Two sharing a private room land near the top of this range.',cats:[['🛏️','Stay','฿300–600 (dorm)'],['🍜','Food','฿200–400'],['🚌','Transport','฿100–250'],['🎟️','Activities','฿200–500']]},
    midrange:{label:'Mid-range',low:2500,high:5000,plus:false,note:'3–4★ hotel, sit-down restaurants and a few tours. Accommodation is roughly per room, so two sharing pay less per person.',cats:[['🛏️','Stay','฿1,200–2,800'],['🍜','Food','฿600–1,200'],['🚌','Transport','฿300–700'],['🎟️','Activities','฿600–1,500']]},
    luxury:{label:'Luxury',low:8000,high:0,plus:true,note:'4–5★ resort, fine dining and private transfers. This is a floor, not a ceiling — shown as “from”.',cats:[['🛏️','Stay','฿5,000+'],['🍜','Food','฿2,000+'],['🚌','Transport','฿1,000+'],['🎟️','Activities','฿2,000+']]}
  };
  var sel='midrange',days=7,ppl=2;
  var baht=function(n){return '฿'+Math.round(n).toLocaleString('en-US');};
  var $=function(id){return document.getElementById(id);};
  function paintStyles(){$('styles').querySelectorAll('.opt').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-k')===sel);});}
  function render(){
    var t=TIERS[sel];
    $('days').textContent=days+(days===1?' day':' days');
    $('ppl').textContent=ppl+(ppl===1?' person':' people');
    var lo=t.low*days*ppl, hi=t.high*days*ppl;
    $('amt').textContent=t.plus?('from '+baht(lo)):(baht(lo)+' – '+baht(hi));
    $('perday').innerHTML=t.plus?('from <b>'+baht(t.low)+'</b> / day / person'):('<b>'+baht(t.low)+'–'+baht(t.high)+'</b> / day / person');
    var rows=t.cats.map(function(c){return '<div class="br"><span class="l"><span class="em">'+c[0]+'</span>'+c[1]+'</span><span class="r">'+c[2]+'</span></div>';});
    rows.push('<div class="br tot"><span class="l">'+t.label+' · per day</span><span class="r">'+(t.plus?('฿'+t.low.toLocaleString('en-US')+'+'):('฿'+t.low.toLocaleString('en-US')+'–'+t.high.toLocaleString('en-US')))+'</span></div>');
    $('bd').innerHTML=rows.join('');
    $('note').textContent='Per-person estimate in Thai baht (฿), excluding international flights. '+t.note;
  }
  var calcTracked=false;
  function onChange(){ render(); if(!calcTracked){calcTracked=true;track('budget_calc',{style:sel});} }
  $('styles').addEventListener('click',function(e){var b=e.target.closest('.opt');if(!b)return;sel=b.getAttribute('data-k');paintStyles();onChange();});
  $('dminus').onclick=function(){days=Math.max(1,days-1);onChange();};
  $('dplus').onclick=function(){days=Math.min(45,days+1);onChange();};
  $('pminus').onclick=function(){ppl=Math.max(1,ppl-1);onChange();};
  $('pplus').onclick=function(){ppl=Math.min(12,ppl+1);onChange();};
  $('toPlanner').onclick=function(){ track('budget_to_planner',{style:sel,days:days,ppl:ppl}); location.href='/trip'; };
  paintStyles();render();
})();
</script>
